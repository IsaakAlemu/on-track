<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>On Track Test</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 12px;
        min-width: 320px;
        color: #111;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        padding: 8px 0;
        border-bottom: 1px solid #e5e7eb;
      }
      li:last-child {
        border-bottom: none;
      }
      .title {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 2px;
        word-break: break-word;
      }
      .meta {
        font-size: 12px;
        color: #4b5563;
      }
      .empty {
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1>Saved Pages</h1>
    <ul id="pages"></ul>
    <script src="popup.js"></script>
  </body>
</html>
