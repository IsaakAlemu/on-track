<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>On Track Test</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 12px;
        min-width: 320px;
        color: #111;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      section {
        margin-bottom: 16px;
      }
      section:last-of-type {
        margin-bottom: 0;
      }
      .goal-section {
        padding-bottom: 12px;
        border-bottom: 1px solid #e5e7eb;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: #374151;
      }
      input {
        font: inherit;
        font-size: 13px;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 6px 10px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: #f9fafb;
        cursor: pointer;
      }
      button:hover {
        background: #f3f4f6;
      }
      .goal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .goal-name {
        font-weight: 600;
        font-size: 14px;
        word-break: break-word;
      }
      .status {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .status.on-track {
        color: #15803d;
      }
      .status.late {
        color: #b91c1c;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 12px;
        font-size: 12px;
        color: #374151;
        margin-bottom: 10px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        padding: 8px 0;
        border-bottom: 1px solid #e5e7eb;
      }
      li:last-child {
        border-bottom: none;
      }
      .title {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 2px;
        word-break: break-word;
      }
      .meta {
        font-size: 12px;
        color: #4b5563;
      }
      .empty {
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <section id="goal" class="goal-section"></section>
    <section>
      <h2>Saved Pages</h2>
      <ul id="pages"></ul>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
